name: Node.js CI (Install, Test and Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ปรับปรุงตรงนี้: เอาบรรทัด cache: 'npm' ออกเพื่อไม่ให้มันบังคับหา lock file
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # ปรับปรุงตรงนี้: เปลี่ยนจาก npm ci เป็น npm install ให้ระบบสร้างโฟลเดอร์อัตโนมัติ
    - name: Install dependencies
      run: npm install

    - name: Run automated tests
      run: npm run test

    - name: Build project
      run: npm run build
