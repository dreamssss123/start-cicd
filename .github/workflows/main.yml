name: Node.js CI (Install, Test and Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
    # 1. ดึงโค้ดจาก Repository ลงมาบนคอมจำลองของ GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. ตั้งค่าสภาพแวดล้อม Node.js พร้อมระบบเซฟแคช (เพื่อช่วยให้รันครั้งต่อไปเร็วขึ้น)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 3. ติดตั้ง Dependencies ทั้งหมดอย่างแม่นยำด้วย npm ci
    - name: Install dependencies
      run: npm ci

    # 4. [ขั้นตอนเพิ่ม] รันคำสั่งตรวจคุณภาพโค้ด (เปิดใช้งานได้โดยการลบเครื่องหมาย # ด้านหน้าออก)
    # - name: Run code linter
    #   run: npm run lint

    # 5. รันระบบทดสอบอัตโนมัติ (หาก Test พัง ระบบจะหยุดทำงานทันที)
    - name: Run automated tests
      run: npm run test

    # 6. ทำการสร้างและคอมไพล์โปรเจกต์ (Build)
    - name: Build project
      run: npm run build
